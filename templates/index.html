<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI くるまデザイナー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI くるまデザイナー</h1>
            <p class="subtitle">子供の塗り絵を北海道の雪山テストコースで走る車に変換</p>
        </header>

        <main class="main-content">
            <div class="left-panel">
                <section class="upload-section">
                    <h2>画像をアップロード</h2>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-placeholder" id="uploadPlaceholder">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <p>ドラッグ＆ドロップ または クリックして選択</p>
                            <span class="file-types">PNG, JPG, JPEG</span>
                        </div>
                        <img id="uploadPreview" class="upload-preview hidden" alt="アップロードされた画像">
                        <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" hidden>
                    </div>
                    <button id="clearUpload" class="btn-secondary hidden">画像をクリア</button>
                </section>

                <section class="car-section">
                    <h2>車種を選択</h2>
                    <div class="radio-group">
                        {% for key, name in car_models.items() %}
                        <label class="radio-label">
                            <input type="radio" name="car_model" value="{{ key }}" {% if key == 'mazda3' %}checked{% endif %}>
                            <span class="radio-custom"></span>
                            <span class="radio-text">{{ name }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </section>

                <section class="mode-section">
                    <h2>走行モードを選択</h2>
                    <div class="radio-group">
                        {% for key, mode in driving_modes.items() %}
                        <label class="radio-label">
                            <input type="radio" name="driving_mode" value="{{ key }}" {% if key == 'dynamic' %}checked{% endif %}>
                            <span class="radio-custom"></span>
                            <span class="radio-text">{{ mode.label }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </section>

                <button id="generateBtn" class="btn-primary" disabled>
                    <span class="btn-text">生成する</span>
                    <span class="btn-loading hidden">
                        <span class="spinner"></span>
                        AIが雪山をシミュレーション中...
                    </span>
                </button>
            </div>

            <div class="right-panel">
                <section class="result-section">
                    <h2>生成結果</h2>
                    <div class="result-area" id="resultArea">
                        <div class="result-placeholder" id="resultPlaceholder">
                            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <p>生成された画像がここに表示されます</p>
                        </div>
                        <img id="resultImage" class="result-image hidden" alt="生成された画像">
                    </div>
                    <button id="saveBtn" class="btn-secondary hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        保存する
                    </button>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 AI くるまデザイナー - Powered by Google Gemini</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
